name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  stage:
    name: Stage npm package for maintainer approval
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - name: Upgrade npm for trusted publishing (OIDC)
        run: npm install -g npm@11.15.0
      - name: Stage package using OIDC
        run: npm stage publish --provenance --access public
      - name: Explain required approval
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## npm approval required
          The package was staged, not published to the public registry.
          A maintainer must review it in npm's Staged Packages tab and approve with 2FA.
          GitHub tags and Releases do not mean the npm version is available yet.
          Verify availability after approval with `npm view @deskeel-org/doctor version`.
          EOF
